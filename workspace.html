    <!-- STITCH_SHADER_START:ANIMATION_WORKSPACE class="fixed inset-0 w-full h-full -z-10" -->
    <div class="fixed inset-0 w-full h-full -z-10" style="display:block;">
    <canvas id="shader-canvas-ANIMATION_WORKSPACE" style="display:block;width:100%;height:100%" width="1280" height="1024"></canvas>
    <script>
    (function() {
      const canvas = document.getElementById('shader-canvas-ANIMATION_WORKSPACE');
    
      function syncSize() {
        const w = canvas.clientWidth  || 1280;
        const h = canvas.clientHeight || 720;
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width  = w;
          canvas.height = h;
        }
      }
      if (typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(syncSize).observe(canvas);
      }
      syncSize();
    
      const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
      if (!gl) return;
      const vs = `attribute vec2 a_position;
    varying vec2 v_texCoord;
    void main() {
      v_texCoord = a_position * 0.5 + 0.5;
      gl_Position = vec4(a_position, 0.0, 1.0);
    }`;
      const fs = `precision highp float;
    varying vec2 v_texCoord;
    uniform float u_time;
    uniform vec2 u_resolution;
    uniform vec2 u_mouse;
    
    float noise(vec2 p) {
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
    }
    
    void main() {
        vec2 uv = v_texCoord;
        vec2 mouse = u_mouse / u_resolution;
        
        float t = u_time * 0.2;
        vec2 p = uv * 2.0 - 1.0;
        p.x *= u_resolution.x / u_resolution.y;
        
        float color = 0.0;
        color += sin(p.x * 2.0 + t + sin(p.y * 3.0 + t));
        color += sin(p.y * 1.5 - t + cos(p.x * 2.5 + t));
        
    // Mouse interaction - subtle glow
    float dist = distance(uv, mouse);
    float glow = smoothstep(0.4, 0.0, dist) * 0.3;
    
    // Deep purple/violet palette from design system
    vec3 col1 = vec3(0.07, 0.07, 0.07); // Surface-low
    vec3 col2 = vec3(0.54, 0.36, 0.96) * 0.15; // Primary-dim
    vec3 finalCol = mix(col1, col2, color * 0.5 + 0.5);
    
    // Add atmospheric grain
    float grain = noise(uv * u_time) * 0.05;
    finalCol += grain;
    finalCol += glow * vec3(0.54, 0.36, 0.96);
    
    gl_FragColor = vec4(finalCol, 1.0);
}`;
    
      const vertShader = gl.createShader(gl.VERTEX_SHADER);
      gl.shaderSource(vertShader, vs);
      gl.compileShader(vertShader);
    
      const fragShader = gl.createShader(gl.FRAGMENT_SHADER);
      gl.shaderSource(fragShader, fs);
      gl.compileShader(fragShader);
    
      const program = gl.createProgram();
      gl.attachShader(program, vertShader);
      gl.attachShader(program, fragShader);
      gl.linkProgram(program);
      gl.useProgram(program);
    
      const positionLoc = gl.getAttribLocation(program, 'a_position');
      const timeLoc = gl.getUniformLocation(program, 'u_time');
      const resLoc = gl.getUniformLocation(program, 'u_resolution');
      const mouseLoc = gl.getUniformLocation(program, 'u_mouse');
    
      const buffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(positionLoc);
      gl.vertexAttribPointer(positionLoc, 2, gl.FLOAT, false, 0, 0);
    
      let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
      window.addEventListener('mousemove', (event) => {
        const rect = canvas.getBoundingClientRect();
        if (rect.width && rect.height) {
          const nx = (event.clientX - rect.left) / rect.width;
          const ny = 1.0 - (event.clientY - rect.top) / rect.height;
          mouse.x = nx * canvas.width;
          mouse.y = ny * canvas.height;
        }
      });
    
      function render(t) {
        syncSize();
        gl.viewport(0, 0, canvas.width, canvas.height);
        if (timeLoc) gl.uniform1f(timeLoc, t * 0.001);
        if (resLoc) gl.uniform2f(resLoc, canvas.width, canvas.height);
        if (mouseLoc) gl.uniform2f(mouseLoc, mouse.x, mouse.y);
        
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        requestAnimationFrame(render);
      }
      render(0);
    })();
    </script>
