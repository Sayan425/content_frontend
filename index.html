<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumina Studio - Auth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Inter:wght@400;600;700&family=Geist:wght@500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app">
      <div id="toast-container"></div>
      <div class="login-container">
        <div class="branding">
          <div class="logo-icon">
            <svg viewBox="0 0 24 24" fill="url(#brand-gradient)" stroke="none">
              <defs>
                <linearGradient id="brand-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#d0bcff" />
                  <stop offset="100%" stop-color="#4cd7f6" />
                </linearGradient>
              </defs>
              <path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z"></path>
            </svg>
          </div>
          <h1>Studio AI</h1>
          <p>Crafting the future of creative flow.</p>
        </div>

        <div class="glass-panel">
          <!-- LOGIN VIEW -->
          <div id="view-login">
            <form id="login-form">
              <div class="form-group">
                <label class="form-label" for="login-email">Email Address</label>
                <div class="input-wrapper">
                  <div class="input-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                  </div>
                  <input type="email" id="login-email" class="input-field" placeholder="youremail@gmail.com" required>
                </div>
              </div>

              <div class="form-group">
                <label class="form-label" for="login-password">
                  Password
                  <a href="#" id="link-forgot-password">Forgot Password?</a>
                </label>
                <div class="input-wrapper">
                  <div class="input-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                  </div>
                  <input type="password" id="login-password" class="input-field" placeholder="••••••••" required>
                  <button type="button" class="password-toggle" tabindex="-1">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                  </button>
                </div>
              </div>

              <button type="submit" class="btn-primary" id="btn-login-submit">Sign In</button>
            </form>

            <div class="divider">Or continue with</div>

            <div class="ghost-buttons">
              <button type="button" id="btn-google" class="btn-ghost">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.283 10.356h-8.327v3.451h4.792c-.446 2.193-2.313 3.453-4.792 3.453a5.27 5.27 0 0 1-5.279-5.28 5.27 5.27 0 0 1 5.279-5.279c1.259 0 2.397.447 3.29 1.178l2.6-2.599c-1.584-1.381-3.615-2.233-5.89-2.233a8.908 8.908 0 0 0-8.934 8.934 8.907 8.907 0 0 0 8.934 8.934c4.467 0 8.529-3.249 8.529-8.934 0-.528-.081-1.097-.202-1.625z"></path></svg>
                Google
              </button>
            </div>

            <div class="footer-text" style="margin-top: 24px;">
              Don't have an account? <a href="#" id="link-show-signup">Sign Up</a>
            </div>
          </div>

          <!-- SIGNUP VIEW -->
          <div id="view-signup" class="hidden">
            <form id="signup-form">
              <div class="form-group">
                <label class="form-label" for="signup-email">Email Address</label>
                <div class="input-wrapper">
                  <div class="input-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                  </div>
                  <input type="email" id="signup-email" class="input-field" placeholder="youremail@gmail.com" required>
                </div>
              </div>

              <div class="form-group">
                <label class="form-label" for="signup-password">Password</label>
                <div class="input-wrapper">
                  <div class="input-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                  </div>
                  <input type="password" id="signup-password" class="input-field" placeholder="••••••••" required>
                  <button type="button" class="password-toggle" tabindex="-1">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                  </button>
                </div>
              </div>
              
              <div class="form-group">
                <label class="form-label" for="signup-confirm-password">Confirm Password</label>
                <div class="input-wrapper">
                  <div class="input-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                  </div>
                  <input type="password" id="signup-confirm-password" class="input-field" placeholder="••••••••" required>
                  <button type="button" class="password-toggle" tabindex="-1">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="eye-icon"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                  </button>
                </div>
              </div>

              <button type="submit" class="btn-primary" id="btn-signup-submit">Create Account</button>
            </form>

            <div class="footer-text" style="margin-top: 24px;">
              Already have an account? <a href="#" id="link-show-login-from-signup">Sign In</a>
            </div>
          </div>

          <!-- FORGOT PASSWORD VIEW -->
          <div id="view-forgot" class="hidden">
            <p style="color: var(--on-surface-variant); font-size: 14px; text-align: center; margin-bottom: 24px;">Enter your email and we'll send you a link to reset your password.</p>
            <form id="forgot-form">
              <div class="form-group">
                <label class="form-label" for="forgot-email">Email Address</label>
                <div class="input-wrapper">
                  <div class="input-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                  </div>
                  <input type="email" id="forgot-email" class="input-field" placeholder="youremail@gmail.com" required>
                </div>
              </div>

              <button type="submit" class="btn-primary" id="btn-forgot-submit">Send Reset Link</button>
            </form>

            <div class="footer-text" style="margin-top: 24px;">
              Remembered your password? <a href="#" id="link-show-login-from-forgot">Back to Login</a>
            </div>
          </div>

        </div>
      </div>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
