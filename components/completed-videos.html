<div class="flex flex-col h-full w-full min-w-0 mx-auto animate-fade-in relative z-10 overflow-hidden text-on-surface">
    <!-- Header Area -->
    <div class="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-8 pt-4">
        <div class="flex flex-col gap-2">
            <h2 class="font-headline-lg text-headline-lg text-white flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-primary/10 border border-primary/20 flex items-center justify-center">
                    <span class="material-symbols-outlined text-[24px] text-primary">video_library</span>
                </div>
                Completed Videos
            </h2>
            <p class="text-on-surface-variant text-sm max-w-2xl">
                Browse and download your fully rendered, approved videos ready for publishing.
            </p>
        </div>
        
        <!-- Search Bar -->
        <div class="w-full md:w-[320px] relative group">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-white/40 group-focus-within:text-primary transition-colors text-[20px]">search</span>
            <input type="text" id="search-completed-videos" placeholder="Search by topic..." class="w-full bg-surface-container-high border border-white/10 rounded-2xl py-3.5 pl-11 pr-4 text-sm text-white placeholder:text-white/30 focus:border-primary/50 focus:ring-1 focus:ring-primary/50 outline-none shadow-inner transition-all">
        </div>
    </div>

    <!-- Completed Videos Grid -->
    <div id="completed-videos-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6 pb-20">
        <!-- Initial Loading State -->
        <div class="col-span-full flex flex-col items-center justify-center py-32 text-center">
            <span class="material-symbols-outlined animate-spin text-[40px] text-primary/50 mb-4">autorenew</span>
            <span class="text-white/60 text-sm animate-pulse">Loading your masterpieces...</span>
        </div>
    </div>
</div>

<!-- Premium Video Playback Modal -->
<div id="modal-video-preview" class="fixed inset-0 z-[100] hidden opacity-0 transition-opacity duration-300">
    <!-- Deep Cinematic Background -->
    <div class="absolute inset-0 bg-[#050505]/95 backdrop-blur-3xl transition-all duration-500"></div>
    
    <!-- Ambient Glow behind the video -->
    <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
        <div class="w-[40vw] h-[60vh] bg-primary/20 blur-[140px] rounded-full mix-blend-screen opacity-60"></div>
        <div class="absolute w-[20vw] h-[40vh] bg-secondary/10 blur-[100px] rounded-full mix-blend-screen opacity-40 translate-x-20 -translate-y-20"></div>
    </div>

    <div class="absolute inset-0 flex flex-col items-center justify-center p-6 sm:p-10">
        <!-- Premium Floating Close Button -->
        <button id="btn-close-preview" class="absolute top-8 right-8 text-white/60 hover:text-white transition-all p-3 rounded-full bg-white/5 hover:bg-white/15 border border-white/10 hover:border-white/30 backdrop-blur-xl shadow-2xl z-50 flex items-center justify-center group active:scale-95">
            <span class="material-symbols-outlined text-[24px] group-hover:rotate-90 transition-transform duration-300">close</span>
            <span class="sr-only">Close</span>
        </button>

        <!-- Device Mockup Container -->
        <div class="relative h-[85vh] max-h-[850px] aspect-[9/16] rounded-[2.5rem] sm:rounded-[3rem] overflow-hidden shadow-[0_0_120px_rgba(208,188,255,0.4),0_50px_120px_rgba(0,0,0,0.9)] border-[8px] sm:border-[10px] border-[#151515] bg-black transform scale-95 transition-all duration-500 ring-1 ring-white/20 z-10 group/player" id="preview-container">
            
            <!-- Subtle Dynamic Island Mockup -->
            <div class="absolute top-0 inset-x-0 flex justify-center pointer-events-none z-20">
                <div class="w-[100px] sm:w-[120px] h-[24px] sm:h-[30px] bg-[#151515] rounded-b-3xl flex items-center justify-center shadow-inner">
                    <div class="w-1.5 h-1.5 rounded-full bg-white/10 ml-12"></div>
                </div>
            </div>

            <video id="preview-video-player" class="w-full h-full object-cover" controls playsinline controlsList="nodownload"></video>
        </div>
    </div>
</div>
