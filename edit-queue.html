<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Studio AI - Edit Queue</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Geist:wght@500;600&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-container": "#a078ff",
                        "primary": "#d0bcff",
                        "on-secondary-fixed-variant": "#004e5c",
                        "on-tertiary-container": "#5b0017",
                        "outline": "#958ea0",
                        "on-surface": "#e5e2e1",
                        "error": "#ffb4ab",
                        "tertiary-fixed-dim": "#ffb2b7",
                        "secondary": "#4cd7f6",
                        "surface-variant": "#353534",
                        "outline-variant": "#494454",
                        "on-surface-variant": "#cbc3d7",
                        "surface": "#131313",
                        "inverse-primary": "#6d3bd7",
                        "on-tertiary-fixed": "#40000d",
                        "surface-bright": "#393939",
                        "secondary-container": "#03b5d3",
                        "inverse-on-surface": "#313030",
                        "on-secondary": "#003640",
                        "primary-fixed-dim": "#d0bcff",
                        "on-primary": "#3c0091",
                        "on-secondary-container": "#00424e",
                        "surface-container": "#201f1f",
                        "surface-container-low": "#1c1b1b",
                        "on-tertiary-fixed-variant": "#92002a",
                        "surface-container-highest": "#353534",
                        "inverse-surface": "#e5e2e1",
                        "on-tertiary": "#67001b",
                        "error-container": "#93000a",
                        "secondary-fixed": "#acedff",
                        "on-primary-container": "#340080",

                        "surface-container-lowest": "#0e0e0e",

                        "on-error": "#690005",
                        "on-primary-fixed-variant": "#5516be",
                        "on-background": "#e5e2e1"

                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "panel-gap": "1px",
                        "timeline-track-height": "32px",
                        "gutter": "16px",
                        "container-margin": "24px",
                        "unit": "4px",
                        "toolbar-height": "48px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "headline-xl": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "headline-lg": ["Inter"],
                        "mono-label": ["Geist"],
                        "label-caps": ["Geist"],
                        "body-sm": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-xl": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg-mobile": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],

                        "body-sm": ["12px", { "lineHeight": "18px", "fontWeight": "400" }]

                }
            }
        }

    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="bg-background text-on-background h-screen overflow-hidden antialiased">
    <!-- Background Canvas -->
    <div class="fixed inset-0 z-0 bg-[url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop')] bg-cover bg-center opacity-30"></div>
    <div class="fixed inset-0 z-0 bg-gradient-to-r from-background via-background/90 to-transparent"></div>
    
    <div class="relative z-10 flex h-full">
        <!-- Sidebar Container (Vanilla JS) -->
        <div id="sidebar-container"></div>

        <!-- React Root for Edit Queue -->
        <main id="react-root" class="ml-[240px] flex-1 flex h-full transition-all duration-300">
            <!-- React will mount here -->
        </main>
    </div>

    <!-- Application Script -->
    <script type="module" src="/src/edit-queue/index.jsx"></script>
</body>
</html>
